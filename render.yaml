services:
  - type: web
    name: movie-night-picker-api
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
